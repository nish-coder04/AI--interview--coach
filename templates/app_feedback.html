<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Feedback</title>
    <style>
        body {
            background-color: #f3f4f7;
            font-family: Arial;
            text-align: center;
            margin: 0;
            padding: 60px 20px 100px;
        }

        h1 {
            color: #3d5a80;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        .feedback-card {
            max-width: 420px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #dde0e6;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            color: #333333;
            font-size: 16px;
            margin-bottom: 6px;
            margin-top: 18px;
        }

        label:first-child {
            margin-top: 0;
        }

        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background-color: #f3f4f7;
            border: 1px solid #cdd3dd;
            color: #333333;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #3d5a80;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            margin-top: 25px;
        }

        .thank-you {
            font-size: 40px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 15px 100px;
            }

            .feedback-card {
                max-width: 100%;
                padding: 25px 20px;
            }

            h1 {
                font-size: 22px;
            }

            select,
            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    {% if submitted %}
    <div class="feedback-card">
        <div class="thank-you">🎉</div>
        <h1>Thank You!</h1>
        <p class="subtitle">Your feedback helps make this app better.</p>
        <a href="/"><button
                style="background:#3d5a80;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;">Back
                to Home</button></a>
    </div>
    {% else %}
    <h1>We'd Love Your Feedback!</h1>
    <p class="subtitle">Tell us what you think about AI Interview Coach.</p>
    <div class="feedback-card">
        <form action="/feedback/give" method="POST">
            <label>How would you rate this app?</label>
            <select name="rating">
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Good</option>
                <option value="3">⭐⭐⭐ Average</option>
                <option value="2">⭐⭐ Below Average</option>
                <option value="1">⭐ Poor</option>
            </select>

            <label>Comments (optional):</label>
            <textarea name="comments" rows="4" placeholder="What did you like? What can be improved?"></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>
    {% endif %}
</body>

</html>
