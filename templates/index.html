<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Coach</title>

    <style>
        body {
            background-color: #f3f4f7;
            text-align: center;
            font-family: Arial;
            color: #333333;
            margin: 0;
            padding: 40px 20px 100px;
        }

        h1 {
            color: #3d5a80;
            font-size: 30px;
            margin-bottom: 35px;
        }

        .profile-card {
            max-width: 420px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #dde0e6;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            color: #333333;
            font-size: 16px;
            margin-bottom: 6px;
            margin-top: 18px;
        }

        label:first-child {
            margin-top: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background-color: #f3f4f7;
            border: 1px solid #cdd3dd;
            color: #333333;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3d5a80;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background-color: #f3f4f7;
            border: 1px solid #cdd3dd;
            color: #333333;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial;
        }

        select:focus {
            outline: none;
            border-color: #3d5a80;
        }

        input[type="file"] {
            color: #333333;
            font-size: 15px;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #3d5a80;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            margin-top: 25px;
        }

        button[type="submit"]:hover {
            background-color: #4a6b96;
        }

        .feedback-prompt {
            margin-top: 30px;
            color: #555;
            font-size: 14px;
        }

        .feedback-prompt a {
            color: #3d5a80;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1c2a3a;
            border-top: 1px solid #16212e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 18px 0;
            min-height: 60px;
            box-sizing: border-box;
        }

        .bottom-nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .profile-card {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>
    <h1>Welcome to AI Interview Prep..!!!</h1>

    <div class="profile-card">
        <form action="/save" method="POST" enctype="multipart/form-data">
            <label>Name:</label>
            <input type="text" name="name">

            <label>Degree:</label>
            <select name="degree">
                <option value="btech">B.Tech</option>
                <option value="be">B.E.</option>
                <option value="bca">BCA</option>
                <option value="bsc">B.Sc</option>
                <option value="mtech">M.Tech</option>
                <option value="mca">MCA</option>
                <option value="other">Other</option>
            </select>

            <label>College:</label>
            <input type="text" name="college">

            <label>Academic Year:</label>
            <select name="year">
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>

            <label>Upload Resume:</label>
            <input type="file" name="resume">

            <button type="submit">Save Profile</button>
        </form>
    </div>

    <p class="feedback-prompt">
        Enjoying the app? <a href="/feedback/give">Share your feedback</a>
    </p>

    <div class="bottom-nav">
        <a href="/profile">👤 Profile</a>
        <a href="/progress">📊 Progress</a>
        <a href="/history">🕐 History</a>
        <a href="/feedback">💬 Feedback</a>
    </div>
</body>

</html>
