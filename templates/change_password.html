<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        body {
            background-color: #f3f4f7;
            text-align: center;
            font-family: Arial;
            color: #333333;
            margin: 0;
            padding: 60px 20px;
        }

        h1 {
            color: #3d5a80;
            font-size: 26px;
            margin-bottom: 30px;
        }

        .auth-card {
            max-width: 380px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #dde0e6;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            color: #333333;
            font-size: 15px;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        label:first-child {
            margin-top: 0;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background-color: #f3f4f7;
            border: 1px solid #cdd3dd;
            color: #333333;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3d5a80;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #3d5a80;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 22px;
        }

        .error-msg {
            color: #b91c1c;
            background: #fdeeea;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .success-msg {
            color: #1a7a3c;
            background: #e6f7ed;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
        }

        .switch-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #555;
        }

        .switch-link a {
            color: #3d5a80;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 15px;
            }

            .auth-card {
                max-width: 100%;
                padding: 25px 20px;
            }

            h1 {
                font-size: 22px;
            }

            input[type="email"],
            input[type="password"] {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <h1>Change Password</h1>

    <div class="auth-card">
        {% if success %}
        <div class="success-msg">✅ Password changed successfully!</div>
        {% else %}
        {% if error %}
        <div class="error-msg">
            {% if error is string %}
            {{ error }}
            {% else %}
            Password must have:
            <ul style="margin: 5px 0 0 0; padding-left: 20px;">
                {% for e in error %}
                <li>{{ e }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
        {% endif %}
        <form action="/change-password" method="POST">
            <label>Current Password:</label>
            <input type="password" name="current_password" required>

            <label>New Password:</label>
            <input type="password" name="new_password" required>

            <label>Confirm New Password:</label>
            <input type="password" name="confirm_password" required>

            <button type="submit">Change Password</button>
        </form>
        {% endif %}
        <p class="switch-link"><a href="/">Back to Home</a></p>
    </div>
</body>

</html>
