<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Round</title>
    <style>
        body {
            background-color: #f3f4f7;
            font-family: Arial;
            text-align: center;
            color: #333333;
            margin: 0;
            padding: 60px 20px;
        }

        h1 {
            color: #3d5a80;
            font-size: 26px;
            margin-bottom: 35px;
        }

        .round-options {
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        form {
            margin: 0;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #ffffff;
            color: #3d5a80;
            border: 1px solid #dde0e6;
            padding: 20px 24px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        button[type="submit"]:hover {
            background-color: #3d5a80;
            color: #ffffff;
            border-color: #3d5a80;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            .round-options {
                max-width: 100%;
            }

            h1 {
                font-size: 20px;
            }

            button[type="submit"] {
                font-size: 16px;
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>
    <h1>{{ company | capitalize }} — Select Round</h1>

    <div class="round-options">
        <form action="/begin" method="POST">
            <input type="hidden" name="company" value="{{ company }}">
            <input type="hidden" name="role" value="{{ role }}">
            <input type="hidden" name="difficulty" value="{{ difficulty }}">
            <input type="hidden" name="round" value="technical">
            <button type="submit">💻 Technical Round</button>
        </form>
        <form action="/begin" method="POST">
            <input type="hidden" name="company" value="{{ company }}">
            <input type="hidden" name="role" value="{{ role }}">
            <input type="hidden" name="difficulty" value="{{ difficulty }}">
            <input type="hidden" name="round" value="hr">
            <button type="submit">🗣️ HR Round</button>
        </form>
        <form action="/begin" method="POST">
            <input type="hidden" name="company" value="{{ company }}">
            <input type="hidden" name="role" value="{{ role }}">
            <input type="hidden" name="difficulty" value="{{ difficulty }}">
            <input type="hidden" name="round" value="managerial">
            <button type="submit">📊 Managerial Round</button>
        </form>
    </div>
</body>

</html>
