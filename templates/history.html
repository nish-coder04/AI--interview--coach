<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview History</title>
    <style>
        body {
            background-color: #f3f4f7;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #3d5a80;
            margin: 20px 0;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            background: white;
            border: 1px solid #dde0e6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        th,
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #dde0e6;
        }

        th {
            background-color: #3d5a80;
            color: white;
        }

        a {
            color: #3d5a80;
            font-weight: bold;
            text-decoration: none;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 0;
            }

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>
    <h1>Interview History</h1>

    <div class="table-wrapper">
        <table>
            <tr>
                <th>Date</th>
                <th>Company</th>
                <th>Role</th>
                <th>Round</th>
                <th>Score</th>
                <th>Details</th>
            </tr>
            {% for interview in interviews %}
            <tr>
                <td>{{ interview[1] }}</td>
                <td>{{ interview[2] | capitalize }}</td>
                <td>{{ interview[3] | upper }}</td>
                <td>{{ interview[4] | capitalize }}</td>
                <td>{{ interview[5] }}%</td>
                <td><a href="/history/{{ interview[0] }}">View Details</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>

</html>
