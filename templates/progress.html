<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Progress</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #185FA5;
            margin: 20px 0;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card h2 {
            color: #185FA5;
            font-size: 28px;
            margin: 0;
        }

        .stat-card p {
            margin: 5px 0 0;
            color: #555;
        }

        .chart-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <h1>Your Progress</h1>

    <div class="stats-row">
        <div class="stat-card">
            <h2>{{ total_interviews }}</h2>
            <p>Total Interviews</p>
        </div>
        <div class="stat-card">
            <h2>{{ average_score }}%</h2>
            <p>Average Score</p>
        </div>
        <div class="stat-card">
            <h2>{{ best_score }}%</h2>
            <p>Best Score</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="scoreChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('scoreChart');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: {{ dates | tojson }},
                datasets: [{
                    label: 'Score %',
                    data: {{ scores | tojson }},
                    borderColor: '#185FA5',
                    backgroundColor: 'rgba(24, 95, 165, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            }
        });
    </script>
</body>

</html>
